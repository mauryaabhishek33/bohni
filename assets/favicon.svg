<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bohni">
  <!-- The Galla mark, same geometry as the hero mark in index.html: a soundbox
       speaker with three waves leaving it, the outermost in marigold. The rupee
       sign the hero carries is dropped here - it is a <text> element, so it
       would depend on a system font, and it is illegible at 16px anyway. -->
  <rect width="64" height="64" rx="14" fill="#12132E"/>
  <g transform="translate(31 32) scale(0.46)">
    <g fill="#FFFCF6">
      <rect x="-46" y="-20" width="22" height="40" rx="5"/>
      <path d="M-26 -18 L-2 -38 Q4 -40 4 -34 L4 34 Q4 40 -2 38 L-26 18 Z"/>
    </g>
    <g fill="none" stroke="#FFFCF6" stroke-width="7" stroke-linecap="round">
      <path d="M23.02 -9.30 A16 16 0 0 1 23.02 9.30"/>
      <path d="M34.42 -17.43 A30 30 0 0 1 34.42 17.43" opacity=".55"/>
      <path d="M45.81 -25.56 A44 44 0 0 1 45.81 25.56" stroke="#F2A007"/>
    </g>
  </g>
</svg>

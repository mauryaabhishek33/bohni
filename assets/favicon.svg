<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bohni">
  <!-- The Galla mark: the first coin of the day dropping into the cash drawer.
       Traced from app/src/main/res/drawable/ic_launcher_foreground.xml, on the
       deep teal of ic_launcher_background.xml, so the browser tab, the launcher
       and the Play listing are one icon.

       This replaces the rupee-in-a-speaker soundbox mark, which the app stopped
       using on 23 Sep 2026. That mark survived here long after the page's own
       hero and the launcher had moved on.

       The rupee and the drawer slot are cut as holes (evenodd), as in the app.
       At a true 16 device pixels the rupee does go muddy - but a tab on any
       current display renders this at 32 or more, where it is clean, and a
       muddy right mark beats a crisp wrong one. -->
  <rect width="64" height="64" rx="14" ry="14" fill="#0E4D5C"/>
  <g transform="scale(0.8888888888888888) translate(-18 -18)">
    <path fill="#FFFFFF" fill-rule="evenodd" d="M33,56 H75 A6,6 0 0 1 81,62 V76 A6,6 0 0 1 75,82 H33 A6,6 0 0 1 27,76 V62 A6,6 0 0 1 33,56 Z M47.5,66 H60.5 A2.5,2.5 0 0 1 63,68.5 A2.5,2.5 0 0 1 60.5,71 H47.5 A2.5,2.5 0 0 1 45,68.5 A2.5,2.5 0 0 1 47.5,66 Z"/>
    <path fill="#F5B324" fill-rule="evenodd" d="M43,40 A11,11 0 1 1 65,40 A11,11 0 1 1 43,40 Z M52.1,33.5 L57.1,33.5 L57.1,35.25 L55.4,35.25 A2.8,2.8 0 0 1 55.8,36.5 L57.1,36.5 L57.1,38.25 L55.8,38.25 A3.2,3.2 0 0 1 52.9,40.8 L57.1,45.4 L57.1,46.5 L55.2,46.5 L50.9,41.7 L50.9,39.8 L52.4,39.8 A1.7,1.7 0 0 0 54,38.25 L50.9,38.25 L50.9,36.5 L54,36.5 A1.7,1.7 0 0 0 52.4,35.25 L50.9,35.25 L50.9,33.5 Z"/>
    <g fill="none" stroke="#F5B324" stroke-width="3.5" stroke-linecap="round">
      <path d="M39,31 L35,26"/>
      <path d="M69,31 L73,26"/>
      <path d="M54,25 L54,20"/>
    </g>
  </g>
</svg>
